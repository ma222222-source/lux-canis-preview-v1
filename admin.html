<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f1ec"><meta name="description" content="Lux Canis管理画面デモ"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./admin.css"><script defer src="./admin.js"></script><title>Lux Canis 管理デモ</title></head><body class="admin-body"><header class="admin-header"><div><strong>Lux Canis</strong><span>管理デモ</span></div><a href="./index.html">お客様サイトを見る ↗</a></header><main class="admin-shell"><aside class="admin-nav"><button class="is-active" data-admin-view="dashboard">今日の確認</button><button data-admin-view="contacts">お問い合わせ</button><button data-admin-view="restock">再販リクエスト</button><button data-admin-view="products">商品管理</button><button data-admin-view="notices">お知らせを送る</button></aside><div class="admin-content">
<section class="admin-view is-active" id="admin-dashboard"><p class="admin-eyebrow">DASHBOARD</p><h1>今日の確認</h1><div class="admin-demo-note">同じ端末で操作したお問い合わせ・再販待ちがここに反映される管理画面デモです。</div><div class="metric-grid"><article><span>新しいお問い合わせ</span><strong id="metric-contacts">0</strong><button data-jump="contacts">確認する</button></article><article><span>再販リクエスト</span><strong id="metric-restock">0</strong><button data-jump="restock">確認する</button></article><article><span>公開商品</span><strong>6</strong><button data-jump="products">確認する</button></article></div></section>
<section class="admin-view" id="admin-contacts"><p class="admin-eyebrow">CONTACTS</p><h1>お問い合わせ</h1><div id="admin-contact-list"></div></section>
<section class="admin-view" id="admin-restock"><p class="admin-eyebrow">RESTOCK</p><h1>再販リクエスト</h1><div id="admin-restock-list"></div></section>
<section class="admin-view" id="admin-products"><p class="admin-eyebrow">PRODUCTS</p><h1>商品管理</h1><div class="admin-table"><div class="admin-row admin-row-head"><span>商品</span><span>表示状態</span><span>公開</span></div><div class="admin-row"><span>Color Mix</span><select><option>NEW</option><option>販売中</option><option>残りわずか</option><option>SOLD OUT</option></select><label><input type="checkbox" checked> 公開</label></div><div class="admin-row"><span>Tiny Drop</span><select><option>SOLD OUT</option><option>販売中</option><option>NEW</option></select><label><input type="checkbox" checked> 公開</label></div></div><button class="admin-primary" data-demo-save>変更を保存</button></section>
<section class="admin-view" id="admin-notices"><p class="admin-eyebrow">NOTICES</p><h1>お知らせを送る</h1><form class="admin-form"><label>種類<select><option>新作</option><option>再販</option><option>新色</option></select></label><label>タイトル<input value="新作が入荷しました"></label><label>本文<textarea rows="5">新しいアクセサリーがLux Canisに仲間入りしました。</textarea></label><fieldset><legend>送信方法</legend><label><input type="checkbox" checked> サイト内のお知らせ</label><label><input type="checkbox"> プッシュ通知（未接続）</label><label><input type="checkbox"> メール通知（未接続）</label></fieldset><button class="admin-primary" type="button" data-demo-send>デモ送信する</button></form></section>
</div></main><div class="toast" id="toast" role="status" aria-live="polite"></div></body></html>
