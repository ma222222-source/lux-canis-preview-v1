<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lux Canisの商品詳細">
  <meta name="theme-color" content="#fbfaf6">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>商品詳細 | Lux Canis</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./product.css">
  <script defer src="./product.js"></script>
</head>
<body>
  <header class="detail-header"><a class="brand" href="./index.html"><span class="brand-name">Lux Canis</span><span class="brand-sub">HANDMADE ACCESSORIES</span></a><a class="back-link" href="./index.html#items">← 商品一覧へ</a></header>
  <main class="product-detail">
    <section class="detail-gallery" aria-label="商品写真">
      <div class="detail-main-image"><span class="detail-status" id="detail-status"></span><img id="detail-image" src="./assets/item-01.webp" alt=""></div>
      <div class="detail-thumbnails" id="detail-thumbnails" aria-label="写真を選ぶ"></div>
    </section>
    <section class="detail-info" aria-labelledby="product-title">
      <p class="kicker">ITEM DETAIL</p>
      <h1 id="product-title">Color Mix</h1>
      <p class="detail-price">¥#,###</p>
      <p class="detail-description" id="detail-description"></p>
      <fieldset class="color-picker"><legend>カラー</legend><div id="color-options"></div></fieldset>
      <dl class="detail-specs"><div><dt>素材</dt><dd id="detail-material"></dd></div><div><dt>金具タイプ</dt><dd id="detail-fitting"></dd></div><div><dt>発送目安</dt><dd>通常1〜2日</dd></div></dl>
      <div class="detail-actions" id="detail-actions"><button class="button button-dark demo-action" type="button" data-message="メルカリの商品URLは未設定です。">Mercariで見る・購入する ↗</button></div>
      <p class="demo-note">カラー選択と購入までの流れを確認できます。販売URLは未設定です。</p>
    </section>
  </main>
  <section class="detail-related"><p class="kicker">YOU MAY ALSO LIKE</p><h2>ほかの商品を見る</h2><a class="button button-primary" href="./index.html#items">商品一覧へ</a></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
