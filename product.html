<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lux Canisの商品詳細">
  <meta name="theme-color" content="#fbfaf6">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>商品詳細 | Lux Canis</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./product.css">
  <link rel="stylesheet" href="./product-enhancements.css">
  <script defer src="./product.js"></script>
</head>
<body>
  <header class="detail-header"><a class="brand" href="./index.html"><span class="brand-name">Lux Canis</span><span class="brand-sub">HANDMADE ACCESSORIES</span></a><a class="back-link" href="./index.html#items">← 商品一覧へ</a></header>
  <main class="product-detail">
    <section class="detail-gallery" aria-label="商品写真">
      <div class="detail-main-image"><span class="detail-status" id="detail-status" hidden></span><img id="detail-image" alt="商品写真" hidden><div class="image-error" id="image-error" role="status" hidden><p>写真を読み込めませんでした</p><button class="button button-dark" id="retry-image" type="button">写真を再読み込み</button></div></div>
      <div class="detail-thumbnails" id="detail-thumbnails" aria-label="写真を選ぶ"></div>
    </section>
    <section class="detail-info" aria-labelledby="product-title">
      <p class="kicker">作品の詳細</p>
      <h1 id="product-title">商品を読み込んでいます</h1>
      <p class="detail-price"></p>
      <p class="detail-description" id="detail-description"></p>
      <fieldset class="color-picker"><legend>カラー</legend><div id="color-options"></div></fieldset>
      <dl class="detail-specs"><div><dt>素材</dt><dd id="detail-material"></dd></div><div><dt>金具タイプ</dt><dd id="detail-fitting"></dd></div><div><dt>在庫</dt><dd id="detail-stock"></dd></div><div><dt>発送目安</dt><dd>通常1〜2日</dd></div></dl>
      <div class="detail-actions" id="detail-actions"></div>
      <p class="demo-note">ご購入前に、販売ページで最新の在庫・価格をご確認ください。色味はお使いの画面や光の当たり方により異なって見える場合があります。</p>
    </section>
  </main>
  <section class="detail-related"><p class="kicker">ほかの作品も</p><h2>商品一覧に戻る</h2><a class="button button-primary" href="./index.html#items">商品一覧へ</a></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
